[project]
name = "eth-protocol-fellowship-site"
version = "0"
description = "Build environment for the EPF dev-update site (zensical)."
requires-python = "==3.14.*"
dependencies = [
    # Rasterizes the site-wide social card (tools/social_card.py) at build time;
    # needs the cairo system library on the build host. 2.9.1 is the security
    # floor (Dependabot alert).
    "cairosvg>=2.9.1,<3",
    # Transitive via cairosvg; listed directly to hold the security floor
    # (13.0.0 fixes the open Dependabot alerts against 12.x).
    "pillow>=13.0.0,<14",
    # Pre-1.0 doc tooling, upper-bounded to the tested minor (matches cuere).
    "zensical>=0.0.72,<0.1",
    # The Updates section is generated by our own zensical-updates sidecar
    # (clean-room rewrite, separate repo), run as a pre-build step. 0.1.8 is
    # the first published release whose feed links resolve under zensical
    # 0.0.72.
    "zensical-updates>=0.1.8,<0.2",
    # Front-matter parsing for tools/llms_txt.py (already in the tree via
    # zensical; pinned directly so the llms.txt step does not rely on a
    # transitive dep).
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
# Test-only. CI installs with --no-dev; run locally with `uv run pytest`.
dev = [
    # 9.0.3 is also the security floor: earlier pytest resolves tmp
    # directories through a predictable, world-accessible path.
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
# tools/ is not a package; expose its modules to the tests by path.
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.uv]
package = false
